[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "release-gate"
version = "0.7.0"
requires-python = ">=3.10"
description = "문진 시스템 검증·배포 게이트 (I4 ReleaseReader, I5 GateService)"
dependencies = ["boundary-contracts>=3.1,<4", "openit-link>=0.4.1,<0.5", "jsonschema>=4.18", "psycopg[binary]>=3.3,<3.4", "waitress>=3.0,<4", "yoyo-migrations>=9,<10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
gate-service = "release_gate.main:serve"


[tool.setuptools]
packages = ["release_gate", "release_gate.components", "release_gate.wiring", "release_gate.types", "release_gate.factories"]


[tool.setuptools.package-data]
release_gate = ["migrations/*/*.sql"]
