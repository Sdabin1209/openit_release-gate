# 개발·시험 전용: 앱 밖의 의존(PostgreSQL)만 띄운다(워크스페이스 규칙 D22). 앱 이미지는 여기 없다.
# 쓰는 법: scripts/dev-postgres.sh up|down. 일회용 데이터(메모리 tmpfs)라 비밀이 필요 없어 trust 인증을 쓴다.
# 호스트 포트는 Docker가 고른다(여러 영역이 같은 서버에서 동시에 돌려도 충돌하지 않게). 주 버전 16은 운영과 같다.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: gate
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gate"]
      interval: 1s
      timeout: 3s
      retries: 40
